iap:
  agent:
    instance-id: "agent-local-dev"
    adapters:
      wef:
        enabled: false
        channel-name: ForwardedEvents
        event-ids: [4720, 4722, 4725, 4726, 4727, 4728, 4729, 4730,
                    4731, 4732, 4733, 4734, 4738, 4754, 4756, 4757, 4758, 4781]
        source-id: "ad://corp.example.com"
      syslog:
        enabled: false
        listen-port: 6514
        protocol: TCP
        source-id-field: hostname
      webhook:
        enabled: false
        listen-port: 8080
      dirsync:
        enabled: false
        ldap-url: "ldap://localhost:389"
        base-dn: "DC=corp,DC=example,DC=com"
        bind-dn: ""
        bind-password: "${DIRSYNC_BIND_PASSWORD:}"
        poll-interval-seconds: 15

spring:
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    com.instantaccessprovider: DEBUG
