# Configuration utilisée par les tests unitaires (pas de contexte Spring requis).
# Désactive Spring Kafka autoconfiguration pour éviter les tentatives de connexion à un broker réel.
spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

iap:
  agent:
    instanceId: "agent-test"
    adapters:
      wef:
        enabled: false
      syslog:
        enabled: false
      webhook:
        enabled: false
      dirsync:
        enabled: false
