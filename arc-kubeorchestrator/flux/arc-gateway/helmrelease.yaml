---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-gateway
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: arc-gateway
      sourceRef:
        kind: GitRepository
        name: arc-kubeorchestrator
        namespace: flux-system
  values:
    image:
      repository: ghcr.io/arckit-iam/arc-gateway
      tag: "0.0.11-dev"
      pullPolicy: IfNotPresent
    imagePullSecrets:
      - name: ghcr
    productManager:
      url: "http://product-manager.default.svc.cluster.local:8080"
    kerberos:
      servicePrincipal: "HTTP/arc-gateway.arckit.fr@IAP.LOCAL"
      keytabSecretName: "arc-gateway-keytab"
      keytabSecretKey: "arc-gateway.keytab"
    auth:
      mode: "ldap"
      basicUser: "dev"
      basicPasswordSecretName: "arc-gateway-basic-auth"
      basicPasswordSecretKey: "basicPassword"
      ldapUrl: "ldap://5.196.15.140:389"
      ldapDomain: "IAP.LOCAL"
