---
apiVersion: v1
kind: ConfigMap
metadata:
  name: arc-gateway-krb5
  namespace: {{.Release.Namespace}}
data:
  krb5.conf: |
    [libdefaults]
        default_realm = IAP.LOCAL
        dns_lookup_realm = false
        dns_lookup_kdc = false
        ticket_lifetime = 24h
        renew_lifetime = 7d
        forwardable = true

    [realms]
        IAP.LOCAL = {
            kdc = 192.168.10.10
            admin_server = 192.168.10.10
        }

    [domain_realm]
        .iap.local = IAP.LOCAL
        iap.local = IAP.LOCAL
        .arckit.fr = IAP.LOCAL
        arckit.fr = IAP.LOCAL
