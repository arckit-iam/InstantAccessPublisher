---
imagePullSecrets:
  - name: ghcr
replicaCount: 1
image:
  repository: ghcr.io/arckit-iam/arc-gateway
  tag: "1.0.0-dev"
  pullPolicy: Always

server:
  port: "8080"

# URL of the product-manager microservice inside the cluster
productManager:
  url: "http://product-manager.default.svc.cluster.local:8080"

kerberos:
  # HTTP/<fqdn>@<REALM> — must match the SPN registered in AD
  servicePrincipal: "HTTP/arc-gateway.arckit.fr@IAP.LOCAL"
  # Name of the k8s Secret holding arc-gateway.keytab
  keytabSecretName: "arc-gateway-keytab"
  keytabSecretKey: "arc-gateway.keytab"

auth:
  # In non-prod, use ldap to authenticate with AD users.
  # Set kerberos for prod-like behavior.
  mode: "ldap"
  basicUser: "dev"
  basicPasswordSecretName: "arc-gateway-basic-auth"
  basicPasswordSecretKey: "basicPassword"
  ldapUrl: "ldap://5.196.15.140:389"
  ldapDomain: "IAP.LOCAL"
