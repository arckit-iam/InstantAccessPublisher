# Démonstration locale de la chaîne ARC, sans Active Directory ni Kubernetes.
# Les composants utilisent les images stables publiées sur GHCR ; l'agent AD
# tourne en mode simulation (dry-run) et ne contacte aucun annuaire. L'agent
# OpenLDAP, lui, écrit réellement dans un Apache DS local.
# Usage : voir la section « Démarrage rapide » du README.

name: arc-demo

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  topics-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"
    entrypoint: ["rpk", "-X", "brokers=redpanda:9092", "topic", "create"]
    command:
      - arc
      - iam.raw.activedirectory
      - iam.raw.isds
      - iam.raw.ldap
      - arc.sync.identity
      - arc.sync.entitlement
      - arc.sync.assignment
      - arc.provisioning.identity
      - arc.provisioning.entitlement
      - arc.provisioning.assignment
      # Ordres de provisioning émis par les managers, consommés par arc-publisher (+ rejets).
      - arc.orders
      - arc.orders.DLT

  topics-init-compacted:
    # Topic du curseur de reprise de la collecte LDAP : seule la dernière valeur par clé est conservée.
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"
    entrypoint: ["rpk", "-X", "brokers=redpanda:9092", "topic", "create"]
    command:
      - -c
      - cleanup.policy=compact
      - iam.raw.ldap.cursor

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arc_publisher
      POSTGRES_USER: arc
      POSTGRES_PASSWORD: arc
    volumes:
      # Copie du schéma de arc-publisher (src/main/resources/db/init.sql)
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      # Bases de product-manager et identity-manager
      - ./postgres-databases.sql:/docker-entrypoint-initdb.d/00-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arc -d arc_publisher"]
      interval: 5s
      timeout: 5s
      retries: 10

  arc-consolidator:
    image: ghcr.io/arckit-iam/arc-consolidator:stable
    platform: linux/amd64
    depends_on:
      topics-init:
        condition: service_completed_successfully
    environment:
      SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS: redpanda:9092
      SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS: redpanda:9092
      IAM_TOPICS_LDAP: iam.raw.ldap
      # Membre technique des groupes LDAP (compte de liaison de l'agent), sans assignation associee
      IAM_LDAP_IGNORED_MEMBERS: uid=admin,ou=system

  arc-auth:
    # Émet les jetons JWT à partir des comptes de l'annuaire. Clé de signature éphémère
    # (régénérée à chaque démarrage) : démonstration uniquement.
    image: ghcr.io/arckit-iam/arc-auth:stable
    platform: linux/amd64
    depends_on:
      apacheds:
        condition: service_healthy
    environment:
      ARC_AUTH_JWT_ISSUER: http://arc-auth:8082
      ARC_AUTH_LDAP_URL: ldap://apacheds:10389
      ARC_AUTH_LDAP_MANAGER_DN: uid=admin,ou=system
      ARC_AUTH_LDAP_MANAGER_PASSWORD: arc-demo-admin
      ARC_AUTH_LDAP_USER_SEARCH_BASE: ou=people,dc=arc,dc=local
      ARC_AUTH_LDAP_GROUP_SEARCH_BASE: ou=groups,dc=arc,dc=local
    ports:
      # Démonstration : exposition locale uniquement (pas de TLS).
      - "127.0.0.1:8082:8082"

  arc-publisher:
    image: ghcr.io/arckit-iam/arc-publisher:stable
    platform: linux/amd64
    depends_on:
      topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/arc_publisher
      SPRING_DATASOURCE_USERNAME: arc
      SPRING_DATASOURCE_PASSWORD: arc
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # Ordres reçus par l'API REST (/orders) et par le topic arc.orders (managers).
      ARC_PUBLISHER_MODE: both
      ARC_ORDERS_TOPIC: arc.orders
      # L'API exige un jeton émis par arc-auth (les clés sont récupérées à la demande).
      ARC_SECURITY_ISSUER_URI: http://arc-auth:8082
      ARC_SECURITY_JWK_SET_URI: http://arc-auth:8082/.well-known/jwks.json
    ports:
      # Démonstration : exposition locale uniquement (pas de TLS).
      - "127.0.0.1:8081:8081"

  product-manager:
    # Produits, profils (groupes) et comptes de service. Construit depuis les sources tant qu'aucune
    # image stable n'est publiée ; remplacer par ghcr.io/arckit-iam/product-manager:stable ensuite.
    build:
      context: https://github.com/arckit-iam/product-manager.git#main
    image: arc-demo/product-manager:local
    depends_on:
      topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      arc-auth:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/product_manager
      SPRING_DATASOURCE_USERNAME: arc
      SPRING_DATASOURCE_PASSWORD: arc
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/product_manager
      SPRING_FLYWAY_USER: arc
      SPRING_FLYWAY_PASSWORD: arc
      ARC_SECURITY_ISSUER_URI: http://arc-auth:8082
      ARC_SECURITY_JWK_SET_URI: http://arc-auth:8082/.well-known/jwks.json
      ARC_AUTH_URL: http://arc-auth:8082
      ARC_AUTH_USERNAME: svc-product-manager
      ARC_AUTH_PASSWORD: arc-demo-service
      ARC_PUBLISHER_URL: http://arc-publisher:8081
      ARC_PUBLISHER_TARGET_SYSTEM: ldap://LDAP01
      # Ordres publiés sur le topic arc.orders (canal api : POST /orders sur arc-publisher).
      ARC_ORDERS_CHANNEL: kafka
      ARC_ORDERS_TOPIC: arc.orders
      # Comptes de service : le nom du produit est extrait du nom du compte (svc-<produit>-<usage>).
      ARC_ACCOUNTS_TYPES_0_NAME: service-account
      ARC_ACCOUNTS_TYPES_0_KIND: NON_USER
      ARC_ACCOUNTS_TYPES_0_PATTERN: svc-(?<product>[a-z0-9]+)-[a-z0-9]+
      ARC_ACCOUNTS_TYPES_0_METADATA_0_NAME: owner
      ARC_ACCOUNTS_TYPES_0_METADATA_0_TYPE: STRING
      ARC_ACCOUNTS_TYPES_0_METADATA_0_REQUIRED: "false"
      # Découverte des comptes depuis l'annuaire collecté (topic arc.sync.identity).
      ARC_DISCOVERY_ENABLED: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    ports:
      # Démonstration : exposition locale uniquement (pas de TLS).
      - "127.0.0.1:8080:8080"

  identity-manager:
    # Identités humaines et comptes utilisateurs. Même remarque que product-manager.
    build:
      context: https://github.com/arckit-iam/identity-manager.git#main
    image: arc-demo/identity-manager:local
    depends_on:
      topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      arc-auth:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/identity_manager
      SPRING_DATASOURCE_USERNAME: arc
      SPRING_DATASOURCE_PASSWORD: arc
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/identity_manager
      SPRING_FLYWAY_USER: arc
      SPRING_FLYWAY_PASSWORD: arc
      ARC_SECURITY_ISSUER_URI: http://arc-auth:8082
      ARC_SECURITY_JWK_SET_URI: http://arc-auth:8082/.well-known/jwks.json
      ARC_AUTH_URL: http://arc-auth:8082
      ARC_AUTH_USERNAME: svc-identity-manager
      ARC_AUTH_PASSWORD: arc-demo-service
      ARC_PUBLISHER_URL: http://arc-publisher:8081
      ARC_PUBLISHER_TARGET_SYSTEM: ldap://LDAP01
      # Ordres publiés sur le topic arc.orders (canal api : POST /orders sur arc-publisher).
      ARC_ORDERS_CHANNEL: kafka
      ARC_ORDERS_TOPIC: arc.orders
      # Matricules générés au format I<DDDDDD> ; comptes standard : I<DDDDDD>, comptes admin : A<DDDDDD>.
      ARC_ACCOUNTS_TYPES_0_NAME: standard
      ARC_ACCOUNTS_TYPES_0_KIND: USER
      ARC_ACCOUNTS_TYPES_0_PATTERN: (?<identity>I\d{6})
      ARC_ACCOUNTS_TYPES_0_IDENTIFIERTEMPLATE: "{identity}"
      ARC_ACCOUNTS_TYPES_1_NAME: admin
      ARC_ACCOUNTS_TYPES_1_KIND: USER
      ARC_ACCOUNTS_TYPES_1_PATTERN: A(?<number>\d{6})
      ARC_ACCOUNTS_TYPES_1_IDENTITYTEMPLATE: "I{number}"
      ARC_ACCOUNTS_TYPES_1_IDENTIFIERTEMPLATE: "A{number}"
      ARC_ACCOUNTS_TYPES_1_METADATA_0_NAME: department
      ARC_ACCOUNTS_TYPES_1_METADATA_0_TYPE: STRING
      ARC_ACCOUNTS_TYPES_1_METADATA_0_REQUIRED: "false"
      # Types de contrat des identités.
      ARC_CONTRACTS_TYPES_0_NAME: employee
      ARC_CONTRACTS_TYPES_0_METADATA_0_NAME: department
      ARC_CONTRACTS_TYPES_0_METADATA_0_TYPE: STRING
      ARC_CONTRACTS_TYPES_0_METADATA_0_REQUIRED: "false"
      ARC_CONTRACTS_TYPES_1_NAME: contractor
      ARC_CONTRACTS_TYPES_1_METADATA_0_NAME: company
      ARC_CONTRACTS_TYPES_1_METADATA_0_TYPE: STRING
      ARC_CONTRACTS_TYPES_1_METADATA_0_REQUIRED: "true"
      ARC_CONTRACTS_TYPES_2_NAME: intern
      ARC_DISCOVERY_ENABLED: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    ports:
      - "127.0.0.1:8083:8083"

  arc-console:
    # Console web : connexion par jeton JWT (arc-auth), puis gestion des produits et des identités.
    build:
      context: https://github.com/arckit-iam/arc-console.git#main
    image: arc-demo/arc-console:local
    depends_on:
      - arc-auth
      - product-manager
      - identity-manager
    environment:
      ARC_AUTH_URL: http://arc-auth:8082
      ARC_PRODUCT_MANAGER_URL: http://product-manager:8080
      ARC_IDENTITY_MANAGER_URL: http://identity-manager:8083
    ports:
      # Démonstration : exposition locale uniquement (pas de TLS).
      - "127.0.0.1:3000:3000"
  arc-agent-ad:
    image: ghcr.io/arckit-iam/arc-agent-ad:stable
    platform: linux/amd64
    depends_on:
      topics-init:
        condition: service_completed_successfully
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      TARGET_SYSTEM: ad://AD01
      ARC_AGENT_DRY_RUN: "true"
      # Valeurs fictives : inutilisées en mode simulation.
      AD_URL: ldaps://ad.example.com:636
      AD_BASE_DN: dc=example,dc=com
      AD_BIND_DN: cn=svc-arc,ou=Services,dc=example,dc=com
      AD_BIND_PASSWORD: unused
      AD_USERS_OU: ou=Users,dc=example,dc=com
      # Type de compte -> OU cible (les managers n'envoient que le type de compte).
      AD_ACCOUNT_TYPE_STANDARD_OU: ou=Tier2,dc=example,dc=com
      AD_ACCOUNT_TYPE_ADMIN_OU: ou=Tier0,dc=example,dc=com
      AD_ACCOUNT_TYPE_SERVICE_ACCOUNT_OU: ou=Tier1,dc=example,dc=com
      AD_TIER0_OU: ou=Tier0,dc=example,dc=com
      AD_TIER1_OU: ou=Tier1,dc=example,dc=com
      AD_TIER2_OU: ou=Tier2,dc=example,dc=com

  apacheds:
    # Annuaire LDAP de démonstration (Apache Directory Server, licence Apache-2.0).
    # Les entrées de ./ldap/seed.ldif sont importées au premier démarrage.
    image: tgbyte/apacheds:2.0.0.AM27
    environment:
      APACHEDS_ADMIN_PASSWORD: arc-demo-admin
      APACHEDS_DOMAIN_NAME: arc
      APACHEDS_DOMAIN_SUFFIX: local
    volumes:
      - ./ldap/seed.ldif:/ldif.d/10-seed.ldif:ro
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:10389 -D uid=admin,ou=system -w arc-demo-admin -b cn=arc-readers,ou=groups,dc=arc,dc=local -s base dn | grep -q '^dn:'"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      # Compte administrateur de démonstration : exposition locale uniquement.
      - "127.0.0.1:10389:10389"

  arc-agent-openldap:
    image: ghcr.io/arckit-iam/arc-agent-openldap:stable
    platform: linux/amd64
    depends_on:
      topics-init:
        condition: service_completed_successfully
      topics-init-compacted:
        condition: service_completed_successfully
      apacheds:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      TARGET_SYSTEM: ldap://LDAP01
      ARC_AGENT_DRY_RUN: "false"
      ARC_AGENT_COLLECTION_ENABLED: "true"
      ARC_AGENT_LDAP_URL: ldap://apacheds:10389
      ARC_AGENT_LDAP_BASE_DN: dc=arc,dc=local
      ARC_AGENT_LDAP_BIND_DN: uid=admin,ou=system
      ARC_AGENT_LDAP_BIND_PASSWORD: arc-demo-admin
      ARC_AGENT_LDAP_USERS_OU: ou=people
      # Type de compte -> branche (les managers n'envoient que le type de compte).
      ARC_AGENT_LDAP_ACCOUNT_TYPE_STANDARD_OU: ou=people
      ARC_AGENT_LDAP_ACCOUNT_TYPE_ADMIN_OU: ou=people
      ARC_AGENT_LDAP_ACCOUNT_TYPE_SERVICE_ACCOUNT_OU: ou=people
      ARC_AGENT_LDAP_GROUPS_OU: ou=groups
