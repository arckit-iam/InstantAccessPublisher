---
imagePullSecrets:
  - name: ghcr

replicaCount: 1

image:
  repository: ghcr.io/arckit-iam/frontend-node
  tag: "0.1.0-dev"
  pullPolicy: IfNotPresent

service:
  port: 3000

ingress:
  enabled: true
  className: traefik
  host: "arc-gateway.arckit.fr"
  tls:
    enabled: true
    clusterIssuer: "letsencrypt-prod"
    secretName: "arc-gateway-tls"
  apiBackendServiceName: "arc-gateway"
  apiBackendServicePort: 8080
