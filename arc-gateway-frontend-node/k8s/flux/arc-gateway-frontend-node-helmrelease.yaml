---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-gateway-frontend-node
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: k8s
      sourceRef:
        kind: GitRepository
        name: arcgatewayfrontendnode
        namespace: flux-system
  values:
    image:
      repository: ghcr.io/arckit-iam/frontend-node
      tag: "0.0.5-dev"
      pullPolicy: IfNotPresent
    imagePullSecrets:
      - name: ghcr
    ingress:
      enabled: true
      className: traefik
      host: "arc-gateway.arckit.fr"
      tls:
        enabled: true
        clusterIssuer: "letsencrypt-prod"
        secretName: "arc-gateway-tls"
      apiBackendServiceName: "arc-gateway"
      apiBackendServicePort: 8080
