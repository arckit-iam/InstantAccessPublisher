---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arc-portal
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if .Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.apiBackendServiceName }}
                port:
                  number: {{ .Values.ingress.apiBackendServicePort }}
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.apiBackendServiceName }}
                port:
                  number: {{ .Values.ingress.apiBackendServicePort }}
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.apiBackendServiceName }}
                port:
                  number: {{ .Values.ingress.apiBackendServicePort }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: arc-gateway-frontend-node
                port:
                  number: {{ .Values.service.port }}
{{- end }}