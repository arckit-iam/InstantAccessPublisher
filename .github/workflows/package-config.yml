name: Package Config

# Déclenché par le même tag produit que build.yml.
# Les deux workflows tournent en parallèle — config et JAR sont toujours alignés.
# Un client iap-integration peut pousser son propre tag v* dans son repo pour
# packager sa config indépendamment.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Upload config artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iap-config-${{ steps.version.outputs.VERSION }}-dev
          path: config/
          retention-days: 30
