name: Promote

on:
  release:
    types: [prereleased, released]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/iap-agent

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # pour attacher le jar à la Release
      packages: write    # pour retagger l'image Docker
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Pre-release : dev → rc ──────────────────────────────────────────────
      - name: Download dev jar from prerelease
        if: github.event.action == 'prereleased'
        uses: dsaltares/fetch-gh-release-asset@v1
        with:
          repo: ${{ github.repository }}
          version: tags/v${{ steps.version.outputs.VERSION }}
          file: iap-agent-${{ steps.version.outputs.VERSION }}-dev.jar

      - name: Promote jar dev → rc
        if: github.event.action == 'prereleased'
        run: mv iap-agent-${{ steps.version.outputs.VERSION }}-dev.jar \
               iap-agent-${{ steps.version.outputs.VERSION }}-rc.jar

      - name: Upload rc jar to prerelease
        if: github.event.action == 'prereleased'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          files: iap-agent-${{ steps.version.outputs.VERSION }}-rc.jar
          prerelease: true

      - name: Promote Docker image dev → rc
        if: github.event.action == 'prereleased'
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-dev
          docker tag  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-dev \
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-rc
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-rc

      # ── Release : rc → stable ───────────────────────────────────────────────
      - name: Download rc jar from prerelease
        if: github.event.action == 'released'
        uses: dsaltares/fetch-gh-release-asset@v1
        with:
          repo: ${{ github.repository }}
          version: tags/v${{ steps.version.outputs.VERSION }}
          file: iap-agent-${{ steps.version.outputs.VERSION }}-rc.jar

      - name: Promote jar rc → stable
        if: github.event.action == 'released'
        run: mv iap-agent-${{ steps.version.outputs.VERSION }}-rc.jar \
               iap-agent-${{ steps.version.outputs.VERSION }}.jar

      - name: Upload stable jar to release
        if: github.event.action == 'released'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          files: iap-agent-${{ steps.version.outputs.VERSION }}.jar
          prerelease: false

      - name: Promote Docker image rc → stable + latest
        if: github.event.action == 'released'
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-rc
          docker tag  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-rc \
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          docker tag  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-rc \
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # ── Deploy (release uniquement) ─────────────────────────────────────────────
  deploy:
    needs: promote
    if: github.event.action == 'released'
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.promote.outputs.version }}
      runner_label: ${{ vars.DEPLOY_RUNNER_LABEL }}
    secrets: inherit