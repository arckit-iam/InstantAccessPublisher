name: Promote

on:
  release:
    types: [prereleased, released]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/iap-agent
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT


      - name: Export GitHub credentials for Maven
        run: |
          echo "GITHUB_ACTOR=${{ github.actor }}" >> $GITHUB_ENV
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Set repo env for Maven
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER}" >> $GITHUB_ENV
          echo "REPO_NAME=$(basename $GITHUB_REPOSITORY)" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.8.0

      - name: Promote jar dev → rc
        if: github.event.action == 'prereleased'
        run: |


          mvn -f agent/pom.xml dependency:get \
            -DremoteRepositories=github::default::https://maven.pkg.github.com/arckit-iam/InstantAccessPublisher \
            -Dartifact=com.instantaccesspublisher:iap-agent:${{ steps.version.outputs.VERSION }}-dev:jar \
            -Ddest=agent/iap-agent-${{ steps.version.outputs.VERSION }}-rc.jar \
            --settings .github/maven-settings.xml

          mvn -f agent/pom.xml deploy:deploy-file \
            -Dfile=agent/iap-agent-${{ steps.version.outputs.VERSION }}-rc.jar \
            -DgroupId=com.instantaccesspublisher \
            -DartifactId=iap-agent \
            -Dversion=${{ steps.version.outputs.VERSION }}-rc \
            -Dpackaging=jar \
            -DrepositoryId=github \
            -Durl=https://maven.pkg.github.com/arckit-iam/InstantAccessPublisher \
            --settings .github/maven-settings.xml

      - name: Promote Docker dev → rc
        if: github.event.action == 'prereleased'
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-dev
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-dev \
                     ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-rc
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-rc

      - name: Promote jar rc → stable
        if: github.event.action == 'released'
        run: |

          mvn -f agent/pom.xml dependency:get \
            -DremoteRepositories=github::default::https://maven.pkg.github.com/arckit-iam/InstantAccessPublisher \
            -Dartifact=com.instantaccesspublisher:iap-agent:${{ steps.version.outputs.VERSION }}-rc:jar \
            -Ddest=agent/iap-agent-${{ steps.version.outputs.VERSION }}.jar

          mvn -f agent/pom.xml deploy:deploy-file \
            -Dfile=agent/iap-agent-${{ steps.version.outputs.VERSION }}.jar \
            -DgroupId=com.instantaccesspublisher \
            -DartifactId=iap-agent \
            -Dversion=${{ steps.version.outputs.VERSION }} \
            -Dpackaging=jar \
            -DrepositoryId=github \
            -Durl=https://maven.pkg.github.com/arckit-iam/InstantAccessPublisher \
            --settings .github/maven-settings.xml

      - name: Promote Docker rc → stable + latest
        if: github.event.action == 'released'
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-rc
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-rc \
                     ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-rc \
                     ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: promote
    if: github.event.action == 'released'
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.promote.outputs.version }}
      runner_label: ${{ vars.DEPLOY_RUNNER_LABEL }}
    secrets: inherit