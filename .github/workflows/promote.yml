name: Promote

on:
  release:
    types: [prereleased, released]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/iap-agent

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read     # on lit les packages / artifacts
      packages: write    # pour retagger Docker et jar
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Pre-release : promote dev → rc ──────────────────────────────
      - name: Promote jar dev → rc
        if: github.event.action == 'prereleased'
        run: |
          echo "Promoting jar dev → rc"
          # Télécharger le jar dev depuis GitHub Packages (Maven)
          mvn dependency:get \
            -DrepoUrl=https://maven.pkg.github.com/${{ github.repository_owner }}/${{ github.repository }} \
            -Dartifact=${{ github.repository_owner }}:${{ github.repository }}:${{ steps.version.outputs.VERSION }}-dev:jar \
            -Ddest=iap-agent-${{ steps.version.outputs.VERSION }}-rc.jar
          
          # Optionnel: upload jar rc dans GitHub Packages
          mvn deploy:deploy-file \
            -Dfile=iap-agent-${{ steps.version.outputs.VERSION }}-rc.jar \
            -DgroupId=${{ github.repository_owner }} \
            -DartifactId=${{ github.repository }} \
            -Dversion=${{ steps.version.outputs.VERSION }}-rc \
            -Dpackaging=jar \
            -DrepositoryId=github \
            -Durl=https://maven.pkg.github.com/${{ github.repository_owner }}/${{ github.repository }}

      - name: Promote Docker dev → rc
        if: github.event.action == 'prereleased'
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-dev
          docker tag  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-dev \
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-rc
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-rc

      # ── Release : promote rc → stable ───────────────────────────────
      - name: Promote jar rc → stable
        if: github.event.action == 'released'
        run: |
          echo "Promoting jar rc → stable"
          # Télécharger le jar rc depuis GitHub Packages
          mvn dependency:get \
            -DrepoUrl=https://maven.pkg.github.com/${{ github.repository_owner }}/${{ github.repository }} \
            -Dartifact=${{ github.repository_owner }}:${{ github.repository }}:${{ steps.version.outputs.VERSION }}-rc:jar \
            -Ddest=iap-agent-${{ steps.version.outputs.VERSION }}.jar

          # Upload jar stable dans GitHub Packages
          mvn deploy:deploy-file \
            -Dfile=iap-agent-${{ steps.version.outputs.VERSION }}.jar \
            -DgroupId=${{ github.repository_owner }} \
            -DartifactId=${{ github.repository }} \
            -Dversion=${{ steps.version.outputs.VERSION }} \
            -Dpackaging=jar \
            -DrepositoryId=github \
            -Durl=https://maven.pkg.github.com/${{ github.repository_owner }}/${{ github.repository }}

      - name: Promote Docker rc → stable + latest
        if: github.event.action == 'released'
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-rc
          docker tag  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-rc \
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          docker tag  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-rc \
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # ── Deploy ─────────────────────────────────────────────
  deploy:
    needs: promote
    if: github.event.action == 'released'
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.promote.outputs.version }}
      runner_label: ${{ vars.DEPLOY_RUNNER_LABEL }}
    secrets: inherit