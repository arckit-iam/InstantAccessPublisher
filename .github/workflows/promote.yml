name: Promote

on:
  release:
    types: [prereleased, released]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/iap-agent

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # pour attacher le zip à la Release
      packages: write    # pour re-tagger l'image Docker
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Pre-release : dev → rc ──────────────────────────────────────────────
      - name: Download dev artifact
        if: github.event.action == 'prereleased'
        uses: actions/download-artifact@v4
        with:
          name: iap-agent-${{ steps.version.outputs.VERSION }}-dev

      - name: Promote zip dev → rc
        if: github.event.action == 'prereleased'
        run: |
          mv iap-agent-${{ steps.version.outputs.VERSION }}-dev.zip \
             iap-agent-${{ steps.version.outputs.VERSION }}-rc.zip

      - name: Upload rc artifact
        if: github.event.action == 'prereleased'
        uses: actions/upload-artifact@v4
        with:
          name: iap-agent-${{ steps.version.outputs.VERSION }}-rc
          path: iap-agent-${{ steps.version.outputs.VERSION }}-rc.zip
          retention-days: 90

      - name: Promote Docker image dev → rc
        if: github.event.action == 'prereleased'
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-dev
          docker tag  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-dev \
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-rc
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-rc

      - name: Download config dev artifact
        if: github.event.action == 'prereleased'
        uses: actions/download-artifact@v4
        with:
          name: iap-config-${{ steps.version.outputs.VERSION }}-dev
          path: iap-config-dev/

      - name: Upload config rc artifact
        if: github.event.action == 'prereleased'
        uses: actions/upload-artifact@v4
        with:
          name: iap-config-${{ steps.version.outputs.VERSION }}-rc
          path: iap-config-dev/
          retention-days: 90

      # ── Release : rc → stable ───────────────────────────────────────────────
      - name: Download rc artifact
        if: github.event.action == 'released'
        uses: actions/download-artifact@v4
        with:
          name: iap-agent-${{ steps.version.outputs.VERSION }}-rc

      - name: Promote zip rc → stable
        if: github.event.action == 'released'
        run: |
          mv iap-agent-${{ steps.version.outputs.VERSION }}-rc.zip \
             iap-agent-${{ steps.version.outputs.VERSION }}.zip

      - name: Upload stable artifact
        if: github.event.action == 'released'
        uses: actions/upload-artifact@v4
        with:
          name: iap-agent-${{ steps.version.outputs.VERSION }}
          path: iap-agent-${{ steps.version.outputs.VERSION }}.zip
          retention-days: 365

      - name: Attach zip to GitHub Release
        if: github.event.action == 'released'
        uses: softprops/action-gh-release@v2
        with:
          files: iap-agent-${{ steps.version.outputs.VERSION }}.zip

      - name: Promote Docker image rc → stable + latest
        if: github.event.action == 'released'
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-rc
          docker tag  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-rc \
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          docker tag  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-rc \
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Download config rc artifact
        if: github.event.action == 'released'
        uses: actions/download-artifact@v4
        with:
          name: iap-config-${{ steps.version.outputs.VERSION }}-rc
          path: iap-config-rc/

      - name: Upload config stable artifact
        if: github.event.action == 'released'
        uses: actions/upload-artifact@v4
        with:
          name: iap-config-${{ steps.version.outputs.VERSION }}
          path: iap-config-rc/
          retention-days: 365

  # ── Deploy (release uniquement) ─────────────────────────────────────────────
  deploy:
    needs: promote
    if: github.event.action == 'released'
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.promote.outputs.version }}
      runner_label: ${{ vars.DEPLOY_RUNNER_LABEL }}
    secrets: inherit
