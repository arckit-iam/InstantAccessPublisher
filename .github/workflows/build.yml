name: Build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/iap-agent

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: maven

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # ── JAR ────────────────────────────────────────────────────────────────
      - name: Build and test
        run: mvn -f agent/pom.xml package --batch-mode

      - name: Rename artifact (dev suffix)
        run: |
          mv agent/target/iap-agent-*.jar \
             agent/target/iap-agent-${{ steps.version.outputs.VERSION }}-dev.jar

      - name: Upload dev artifact
        uses: actions/upload-artifact@v4
        with:
          name: iap-agent-${{ steps.version.outputs.VERSION }}-dev
          path: agent/target/iap-agent-${{ steps.version.outputs.VERSION }}-dev.jar
          retention-days: 30

      # ── Docker image ────────────────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image (dev)
        uses: docker/build-push-action@v6
        with:
          context: agent
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
