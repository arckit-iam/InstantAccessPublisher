name: Build and Deploy Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version de l'image Docker à déployer"
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/instantaccessprovider:${{ inputs.version }}

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, ubuntu, vps, iap-k3s]
    steps:
      - name: Log in to DockerHub
        run: echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      # Optionnel : pré-pull de l'image sur le nœud
      - name: Pull image (optionnel)
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/instantaccessprovider:${{ inputs.version }} || true

      - name: Set image in k3s deployment
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          kubectl set image deployment/instantaccessprovider \
            instantaccessprovider=${{ secrets.DOCKERHUB_USERNAME }}/instantaccessprovider:${{ inputs.version }}